# netcrawl-server + PostgreSQL, e.g. in a Proxmox LXC with Docker.
#
#   cd deploy && cp .env.example .env   # set NETCRAWL_DB_PASSWORD and NETCRAWL_PUBLIC_URL
#   docker compose up -d --build
#
# The server speaks HTTPS on port 8443 with a self-signed certificate that
# is created on first start and kept in the server-data volume. Crawlers
# trust exactly its key (pinning), so no CA is needed; browsers show a
# warning once. With a domain and your own certificate, see docs/SERVER.md.
name: netcrawl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netcrawl
      POSTGRES_USER: netcrawl
      POSTGRES_PASSWORD: ${NETCRAWL_DB_PASSWORD:?set NETCRAWL_DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcrawl -d netcrawl"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      args:
        VERSION: ${NETCRAWL_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["serve", "--listen", "0.0.0.0:8443", "--event-log-dir", "/data/events"]
    environment:
      NETCRAWL_DATABASE_URL: postgres://netcrawl:${NETCRAWL_DB_PASSWORD}@db:5432/netcrawl?sslmode=disable
      # How crawlers reach the server; enables the installer (one-liner).
      NETCRAWL_PUBLIC_URL: ${NETCRAWL_PUBLIC_URL:-}
      NETCRAWL_TLS_SELF_SIGNED_DIR: /data/tls
    volumes:
      - server-data:/data
    ports:
      - "${NETCRAWL_BIND:-0.0.0.0}:${NETCRAWL_HTTPS_PORT:-8443}:8443"

volumes:
  db-data:
  server-data:
