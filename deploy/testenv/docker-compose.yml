# Local NetCrawl test environment (loopback pilot). Use ./testenv.sh, not
# this file directly.
#
# All containers share the host network and talk via 127.0.0.1, so the
# setup needs no Docker networks or Docker DNS (which some hosts, e.g.
# Docker inside an LXC, don't provide). Everything listens on 127.0.0.1
# only. Linux only.
name: netcrawl-test

services:
  db:
    image: postgres:16-alpine
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-p", "${NETCRAWL_DB_PORT:-55432}"]
    environment:
      POSTGRES_DB: netcrawl
      POSTGRES_USER: netcrawl
      POSTGRES_PASSWORD: ${NETCRAWL_DB_PASSWORD:?run ./testenv.sh up}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${NETCRAWL_DB_PORT:-55432} -U netcrawl -d netcrawl"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      target: server
      args:
        VERSION: ${NETCRAWL_VERSION:-}
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["serve", "--listen", "127.0.0.1:${NETCRAWL_PORT:-8080}", "--event-log-dir", "/data/events", "--scheduler-interval", "15s"]
    volumes:
      - ./data:/data
    environment:
      NETCRAWL_DATABASE_URL: postgres://netcrawl:${NETCRAWL_DB_PASSWORD}@127.0.0.1:${NETCRAWL_DB_PORT:-55432}/netcrawl?sslmode=disable
      # Installer over plain http, accepted for loopback only.
      NETCRAWL_PUBLIC_URL: http://127.0.0.1:${NETCRAWL_PORT:-8080}

  # Scan target: a tiny web server on 127.0.0.1.
  target:
    image: busybox:1.36
    network_mode: host
    command: ["sh", "-c", "mkdir -p /www && echo '<title>NetCrawl Testziel</title>' > /www/index.html && httpd -f -p 127.0.0.1:${NETCRAWL_TARGET_PORT:-18081} -h /www"]

  # The crawler: 127.0.0.1 is the host's loopback, where server and target listen.
  agent:
    build:
      context: ../..
      target: agent
      args:
        VERSION: ${NETCRAWL_VERSION:-}
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
    depends_on:
      - server
      - target

volumes:
  db-data:
